services:
  staging-db:
    image: postgres:16
    environment:
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: dwh_pass
      POSTGRES_DB: staging
    ports:
      - "5433:5432"
    volumes:
      - staging-db-volume:/var/lib/postgresql/data

  airflow-worker:
    volumes:
      - ..:/opt/airflow/project
    environment:
      PGHOST: staging-db
      PGPORT: "5432"
      PGUSER: dwh_user
      PGPASSWORD: dwh_pass
      PGDATABASE: staging

  airflow-apiserver:
    volumes:
      - ..:/opt/airflow/project

volumes:
  staging-db-volume: